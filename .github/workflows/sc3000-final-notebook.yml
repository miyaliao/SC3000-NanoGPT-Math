name: SC3000 instructor-template integrity
on:
  push:
    branches: [sc3000-final-reproducible-notebook]
  pull_request:
    paths:
      - 'dpo/dpo.ipynb'
      - '.github/workflows/sc3000-final-notebook.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify original teacher scaffold, stage contract, and Python syntax
        run: |
          python - <<'PY'
          import ast,json,pathlib,re
          notebook=json.loads(pathlib.Path("dpo/dpo.ipynb").read_text())
          original=json.loads(pathlib.Path("dpo/reference_course_notebook_v1.json").read_text())
          cells=notebook["cells"]
          source=lambda c:"".join(c["source"])
          code=[source(c) for c in cells if c["cell_type"]=="code"]
          for i,c in enumerate(code):compile(c,"notebook-cell-%d"%i,"exec")
          steps=[source(c).splitlines()[0] for c in cells
                 if c["cell_type"]=="markdown" and source(c).startswith("### Step ")]
          expected=[source(original["cells"][i]).splitlines()[0]
                    for i in (0,2,4,6,8,10,12,14)]
          assert steps==expected,(steps,expected)
          for old_idx in (5,7,9,11):
              original_source=source(original["cells"][old_idx])
              assert any(x==original_source for x in code),old_idx
          old_step7=source(original["cells"][13])
          assert all(line in "\n".join(code) for line in
                     ("RUN_SINGLE_STAGE_DEMO=False",
                      "    "+old_step7.splitlines()[0],
                      "    "+old_step7.splitlines()[-1]))
          old_test=re.search(r'^test_set = \[.*\]$',source(original["cells"][15]),re.M).group()
          assert old_test in "\n".join(code)
          for required in ("FAST_SMOKE=False","STAGE1_TO_4","STAGE5_TO_7",
                           "stage_course_preference_loss(","stage_get_batches(",
                           "train_stage(","greedy_original_stop(",
                           "FINAL_EXPORT_POLICY"):
              assert required in "\n".join(code),required
          assert not any("BUNDLED_GENERATOR_SOURCE" in x for x in code)
          assert sum(x["actual_epochs"] for c in code
                     for node in ast.walk(ast.parse(c))
                     if isinstance(node,ast.Assign)
                     for t in node.targets if isinstance(t,ast.Name) and
                     t.id in ("STAGE1_TO_4","STAGE5_TO_7")
                     for x in ast.literal_eval(node.value)
                     if isinstance(x,dict) and "actual_epochs" in x)==13
          print("PASS instructor 8 headings, original core code, preserved test_set, 13-epoch contract")
          PY
